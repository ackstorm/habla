name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
      - run: GOARCH=arm64 go build ./...
      - run: sh -n install.sh
      - run: shellcheck -s sh install.sh

  gui:
    runs-on: ubuntu-latest
    continue-on-error: true # optional until the tray is proven on a runner
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
      - run: sudo apt-get update && sudo apt-get install -y xvfb x11-utils xdotool dbus libayatana-appindicator3-1 libgtk-layer-shell0
      - run: HABLA_GUI=1 xvfb-run -a dbus-run-session -- go test ./internal/gtk/ ./internal/tray/
